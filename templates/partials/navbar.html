{% load static %}

<!-- py-1 reduz o espaçamento vertical da barra ao mínimo -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-1 border-bottom">
  
  <!-- container-fluid faz a navbar ocupar 100% da largura da tela com um leve respiro lateral (px-3 ou px-4) -->
  <div class="container-fluid px-4">
    
    <!-- Logo + Nome EcoColeta -->
    <a class="navbar-brand d-flex align-items-center gap-2 py-0" href="{% url 'home' %}">
      <img id="logo" src="{% static 'img/logo.png' %}" alt="EcoColeta Logo" class="d-inline-block align-text-top navbar-logo">
      <span class="fw-bold fs-5 m-0 text-dark-green">
            <span class="text-light-green">Eco</span>Coleta
        </span>
    </a>

    <!-- Botão Hambúrguer (Mobile) -->
    <button class="navbar-toggler border-0 shadow-none py-1" type="button" data-bs-toggle="collapse" data-bs-target="#navEcoColeta" aria-controls="navEcoColeta" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links de Navegação -->
    <div class="collapse navbar-collapse" id="navEcoColeta">
      <ul class="navbar-nav w-100 justify-content-around mb-0 text-center py-2 py-lg-0 ms-lg-4">
        <li class="nav-item">
          <a class="nav-link text-dark-green fw-semibold py-1 nav-link-hover" href="{% url 'materiais' %}">Guia Materiais</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark-green fw-semibold py-1 nav-link-hover" href="{% url 'contato' %}">Contato</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark-green fw-semibold py-1 nav-link-hover" href="{% url 'como_funciona' %}">Como Funciona</a>
